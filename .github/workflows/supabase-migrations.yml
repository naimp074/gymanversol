# Aplica en Supabase las migraciones nuevas de supabase/migrations/ cada vez que llegan a main.
# Se conecta a la base por el Session pooler (IPv4), sin token de la API de Supabase.
#
# Secret necesario (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL · Supabase → botón "Connect" → "Session pooler" → URI, con la contraseña real
#                     en lugar de [YOUR-PASSWORD]. Ejemplo:
#                     postgresql://postgres.abcd1234:CLAVE@aws-0-sa-east-1.pooler.supabase.com:5432/postgres
name: Migraciones de Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/supabase-migrations.yml']
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Verificar configuración
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta el secret SUPABASE_DB_URL (Supabase → Connect → Direct → Session pooler)."
            exit 1
          fi

      - name: Migraciones pendientes
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Aplicar migraciones
        run: supabase db push --db-url "$SUPABASE_DB_URL"
