# Aplica en Supabase las migraciones nuevas de supabase/migrations/ cada vez que llegan a main.
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  · supabase.com → Account → Access Tokens
#   SUPABASE_DB_PASSWORD   · contraseña de la base elegida al crear el proyecto
#   SUPABASE_PROJECT_REF   · el código de la URL: https://<ref>.supabase.co
name: Migraciones de Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vincular el proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Migraciones pendientes
        run: supabase migration list

      - name: Aplicar migraciones
        run: supabase db push
